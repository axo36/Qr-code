<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verrouille le QR code</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#0a0c10;--ink:#e8edf3;--mut:#8b96a5;--a:#5ad1ff;--line:#ffffff1f;--panel:#12161dcc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 1px 1px,#ffffff14 1px,transparent 1.5px) 0 0/28px 28px,radial-gradient(70% 55% at 50% 0%,color-mix(in srgb,var(--a) 16%,transparent),transparent 70%)}
#c{position:fixed;inset:0;width:100%;height:100%}
.top,.hint{position:fixed;left:12px;right:12px;margin:0 auto;max-width:560px;border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:14px;padding:11px 16px;font-size:13px;font-weight:600;pointer-events:none}
.meter{flex:1;display:flex;align-items:center;gap:10px}
.meter small{font-size:12px;font-weight:400;color:var(--mut);min-width:64px}
.meter i{flex:1;height:4px;border-radius:4px;background:#ffffff1a;overflow:hidden}
.meter b{display:block;height:100%;width:100%;background:var(--a);border-radius:4px}
body.ko .meter b{background:#fff}
.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:12px 16px;font-size:13px;line-height:1.55;color:var(--mut)}
.hint a{color:var(--ink);text-underline-offset:3px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 68px);translate:-50% 0;padding:8px 16px;border-radius:99px;background:var(--a);color:#04121a;font-size:13px;font-weight:800;opacity:0;pointer-events:none;white-space:nowrap}
#toast.on{animation:t 1.1s ease-out}
@keyframes t{0%{opacity:0;translate:-50% -6px}15%,75%{opacity:1;translate:-50% 0}100%{opacity:0}}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
</style></head>
<body>
<div class="bg"></div><canvas id="c"></canvas>
<header class="top"><span id="l"></span><div class="meter"><small id="ml">Stabilité</small><i><b id="hpf"></b></i></div><span id="r"></span></header>
<div class="hint" id="hint"></div>
<div id="toast"></div>
<script>
const C={"n": 1, "a": "#5ad1ff", "rgb": "90,209,255", "speed": 1, "size": 1, "decoys": 3, "target": "https://axo36.github.io/Qr-code/niveau2.html", "hint": "Touche le QR code pour le déstabiliser. Quand il est verrouillé, scanne-le avec un deuxième téléphone.", "next": "https://axo36.github.io/Qr-code/niveau2.html", "nextLabel": "Pas de deuxième téléphone ? Passer au niveau 2"},KO=9;
const cv=document.getElementById('c'),g=cv.getContext('2d'),hpf=document.getElementById('hpf'),ml=document.getElementById('ml'),L=document.getElementById('l'),R=document.getElementById('r'),toast=document.getElementById('toast'),hint=document.getElementById('hint');
const rgb=a=>`rgba(${C.rgb},${a})`;
function makeQR(t){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),m=3,k=10,N=(n+m*2)*k,c=document.createElement('canvas');c.width=c.height=N;
const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);x.fillStyle='#0b0f14';
for(let r=0;r<n;r++)for(let i=0;i<n;i++)if(q.isDark(r,i)){x.beginPath();x.roundRect((i+m)*k,(r+m)*k,k,k,k*.14);x.fill()}
return c}
const img={real:makeQR(C.target),d:[makeQR('Raté ! Ce n’est pas le bon QR code.'),makeQR('Leurre : cherche le vrai QR code.')]};
let W,H,hp=100,ko=0,hits=0,parts=[],rings=[],trail=[],decoys=[],dodge=0,flash=0,spawn=4,wasKo=false,last=performance.now();
const real={x:0,y:0,vx:0,vy:0,s:0};
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);real.s=Math.min(190,W*.42)*C.size}
addEventListener('resize',size);size();
const spd=()=>Math.max(190,W*.34)*C.speed;
function kick(e,m){const a=Math.random()*6.283;e.vx=Math.cos(a)*spd()*m;e.vy=Math.sin(a)*spd()*m}
real.x=(W-real.s)/2;real.y=(H-real.s)/2;kick(real,1);
function ring(x,y,big){rings.push({x,y,r:6,l:1,big})}
function dots(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=60+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}}
function say(t){toast.textContent=t;toast.classList.remove('on');void toast.offsetWidth;toast.classList.add('on')}
function hud(){L.textContent='Niveau '+C.n+' sur 2';R.textContent='Coups '+hits}
function move(e,dt){e.x+=e.vx*dt;e.y+=e.vy*dt;let h=0;
if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);h=1}else if(e.x+e.s>W){e.x=W-e.s;e.vx=-Math.abs(e.vx);h=1}
if(e.y<0){e.y=0;e.vy=Math.abs(e.vy);h=1}else if(e.y+e.s>H){e.y=H-e.s;e.vy=-Math.abs(e.vy);h=1}
return h}
const inside=(e,x,y)=>x>=e.x-8&&x<=e.x+e.s+8&&y>=e.y-8&&y<=e.y+e.s+8;
addEventListener('pointerdown',ev=>{if(ev.target.closest('a'))return;const px=ev.clientX,py=ev.clientY;
for(let i=decoys.length-1;i>=0;i--)if(inside(decoys[i],px,py)){ring(px,py,0);dots(px,py,14);decoys.splice(i,1);say('Leurre détruit');return}
if(inside(real,px,py)){
 if(ko>0){say('Scanne maintenant');return}
 hp=Math.max(0,hp-12);hits++;flash=.15;ring(px,py,0);dots(px,py,12);hud();
 if(hp<=0){ko=KO;real.vx=real.vy=0;decoys.forEach(d=>ring(d.x+d.s/2,d.y+d.s/2,0));decoys=[];ring(real.x+real.s/2,real.y+real.s/2,1);say('Verrouillé');ml.textContent='Verrouillé';navigator.vibrate&&navigator.vibrate(120)}
 else{real.vx*=-1;real.vy*=-1;navigator.vibrate&&navigator.vibrate(25)}
}else ring(px,py,0)});
addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse'||ko>0||dodge>0)return;
const dx=real.x+real.s/2-ev.clientX,dy=real.y+real.s/2-ev.clientY,d=Math.hypot(dx,dy);
if(d<real.s*.9+40){const m=spd()*2.2/(d||1);real.vx=dx*m;real.vy=dy*m;dodge=.8}});
function tile(e,im,a,off,brk,sh){g.save();g.translate(e.x+e.s/2+(sh?(Math.random()-.5)*sh*30:0),e.y+e.s/2+(sh?(Math.random()-.5)*sh*30:0));
g.globalAlpha=a;const h=e.s/2;g.beginPath();g.roundRect(-h,-h,e.s,e.s,10);
g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=28;g.shadowOffsetY=8;g.fillStyle='#fff';g.fill();g.shadowColor='transparent';
g.save();g.clip();g.imageSmoothingEnabled=false;g.drawImage(im,-h,-h,e.s,e.s);g.restore();
const o=h+off,l=e.s*.2;g.strokeStyle=brk;g.lineWidth=2.5;g.lineCap='round';g.beginPath();
[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{g.moveTo(sx*o,sy*(o-l));g.lineTo(sx*o,sy*o);g.lineTo(sx*(o-l),sy*o)});
g.stroke();g.restore()}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;dodge-=dt;flash=Math.max(0,flash-dt);
if(ko>0){ko-=dt;if(ko<=0)wasKo=true}
if(wasKo){wasKo=false;ko=0;hp=100;kick(real,2);say('Il se réveille');ml.textContent='Stabilité'}
if(ko<=0){hp=Math.min(100,hp+4*dt);
 const m=Math.hypot(real.vx,real.vy)||1,tg=spd()*(.4+.6*hp/100)*(dodge>0?2:1),k=1+(tg/m-1)*Math.min(1,dt*4);real.vx*=k;real.vy*=k;
 if(move(real,dt))ring(real.x+real.s/2,real.y+real.s/2,0);
 trail.push({x:real.x,y:real.y,s:real.s});if(trail.length>9)trail.shift();
 spawn-=dt;if(spawn<=0&&decoys.length<C.decoys){spawn=4.5;const a=Math.random()*6.283;
  decoys.push({x:Math.random()*(W-real.s),y:Math.random()*(H-real.s),s:real.s*.9,vx:Math.cos(a)*spd()*1.1,vy:Math.sin(a)*spd()*1.1,i:decoys.length%2})}
 decoys.forEach(d=>move(d,dt))}else trail=[];
hpf.style.width=(ko>0?ko/KO*100:hp)+'%';document.body.classList.toggle('ko',ko>0);
g.clearRect(0,0,W,H);
const cx=real.x+real.s/2,cy=real.y+real.s/2,gr=g.createRadialGradient(cx,cy,0,cx,cy,real.s*1.5);gr.addColorStop(0,rgb(.2));gr.addColorStop(1,rgb(0));g.fillStyle=gr;g.fillRect(0,0,W,H);
trail.forEach((p,i)=>{g.strokeStyle=rgb(i/trail.length*.25);g.lineWidth=1;g.strokeRect(p.x,p.y,p.s,p.s)});
decoys.forEach(d=>tile(d,img.d[d.i],.95,12,'rgba(255,255,255,.35)',0));
const blink=ko<=0&&(Math.sin(t/173)+Math.sin(t/421))>1.75,pulse=ko>0?6:12+Math.sin(t/260)*2;
tile(real,img.real,blink?.15:1,pulse,flash>0?'#fff':C.a,flash);
g.font='600 13px Manrope, system-ui, sans-serif';g.textAlign='center';g.fillStyle=ko>0?'#fff':'rgba(232,237,243,.55)';
const ty=real.y+real.s+34<H-70?real.y+real.s+34:real.y-22;
g.fillText(ko>0?'Verrouillé · '+Math.ceil(ko)+' s':Math.round(Math.hypot(real.vx,real.vy))+' px/s',cx,ty);
rings=rings.filter(r=>r.l>0);rings.forEach(r=>{r.r+=(r.big?520:160)*dt;r.l-=dt*(r.big?1:2);g.strokeStyle=rgb(Math.max(0,r.l)*.8);g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,r.r,0,6.283);g.stroke()});
parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt*1.8;g.fillStyle=rgb(Math.max(0,p.l));g.fillRect(p.x,p.y,3,3)});
requestAnimationFrame(loop)}
hud();hint.innerHTML='<span>'+C.hint+'</span><br>';
const a=document.createElement('a');a.href=C.next;a.textContent=C.nextLabel;hint.appendChild(a);
requestAnimationFrame(loop);
</script>
</body></html>
